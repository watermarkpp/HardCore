<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HardCore · 地狱火动画预览</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#eadcc3;background:#101213;font-size:14px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 45% -15%,#313029,#111314 52%)}
header{padding:18px 24px;border-bottom:1px solid #514837;background:#161817e8}h1{margin:7px 0;font-size:24px}h2{font-size:18px;margin:0 0 14px}p{color:#bcb5a4;line-height:1.6}a{color:#eac68c}
.shell{display:grid;grid-template-columns:minmax(540px,1fr) 320px;gap:16px;padding:16px;max-width:1180px;margin:auto}
.panel{background:#1b1e1e;border:1px solid #454337;border-radius:11px;padding:17px;min-width:0}
button,select{font:inherit;color:#efe2c9;background:#282c2a;border:1px solid #6a604b;border-radius:6px;padding:9px 11px;cursor:pointer}button:hover{border-color:#d5aa6d}button.active{border-color:#efc074;background:#57432a}button:disabled{opacity:.45}
.views{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin:12px 0}.view{display:flex;flex-direction:column;align-items:center;gap:7px;color:#bcb5a4}
.stage,.detail{overflow:hidden;border:1px solid #3d3f37;border-radius:6px}.stage{width:540px;height:450px}.detail{width:270px;height:210px;background:#333}
.stage canvas,.detail canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.stage.game{background-image:url('/api/ground_wide.png');background-size:cover}.stage.gray,.detail.gray{background:#676767}.stage.black,.detail.black{background:#050505}.stage.checker,.detail.checker{background-color:#555;background-image:linear-gradient(45deg,#777 25%,transparent 25%),linear-gradient(-45deg,#777 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#777 75%),linear-gradient(-45deg,transparent 75%,#777 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.tools,.timeline{display:flex;gap:6px;flex-wrap:wrap}.timeline button{min-width:46px}.field{margin:0 0 15px}.field label{display:block;margin:0 0 7px}input[type=range],select{width:100%;accent-color:#efc074}.hint{font-size:12px;color:#aaa18c;margin-top:15px}.status{color:#d9a78e;min-height:20px;margin-top:12px}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.stage{width:min(100%,540px);height:auto;aspect-ratio:6/5}}
</style>
</head>
<body>
<header><div style="color:#b99b6d;font-size:11px;letter-spacing:.2em">HARDCORE · ART WORKSPACE</div><h1>地狱火 · 原始素材试稿</h1>
<p>读取原始 <code>Magic.wil</code> 六帧，并按游戏的火焰轨迹每 50 毫秒逐段出现、消散。动画自动循环。<a href="/temptation">诱惑之光</a> · <a href="/lightning">雷电术</a></p></header>
<div class="shell"><main class="panel">
<div class="field"><label for="direction">示例目标方向</label><select id="direction"><option value="160,80">画面右下（默认）</option><option value="160,0">画面右</option><option value="160,-80">画面右上</option><option value="0,-160">画面上</option><option value="-160,-80">画面左上</option><option value="-160,0">画面左</option><option value="-160,80">画面左下</option><option value="0,160">画面下</option></select></div>
<div class="views"><div class="view"><span>游戏地面参照 · 逐段延伸</span><div class="stage game" id="stage"><canvas id="preview" width="360" height="300"></canvas></div></div>
<div class="view"><span>原始六帧 · 放大细节</span><div class="detail" id="detail-box"><canvas id="detail" width="180" height="140"></canvas></div></div></div>
<div class="field"><label>轨迹时间轴 · <span id="step-label">第 1 步</span>　细节 <span id="frame-label">F0</span></label><div class="timeline" id="timeline"></div></div>
<div class="tools"><button id="play">暂停</button><button id="prev">上一步</button><button id="next">下一步</button></div>
</main><aside class="panel">
<h2>火焰暗部透明化</h2><div class="field"><label for="haze">强度 <span id="haze-value">100%</span>（0–300%）</label><input id="haze" type="range" min="0" max="3" step="0.01" value="1"></div>
<div class="tools"><button id="original">看原图 0%</button><button id="trial">看采用值 150%</button><button id="undo">撤销调整</button></div>
<p class="hint">六帧按游戏的序列边界居中，沿示例五格目标线逐段释放。淡色底带是游戏几何光带的示意；具体边界由正式战斗快照决定。改变方向只影响本地演示。正式贴图已采用 150%，这里继续试调不会发布。</p>
<div class="field"><label for="background">背景</label><select id="background"><option value="game">真实地面参照</option><option value="gray">灰色</option><option value="checker">透明棋盘</option><option value="black">黑色</option></select></div>
<div class="status" id="status" role="status"></div>
</aside></div>
<script>
const $=id=>document.getElementById(id);
let state=null,step=0,playing=true,lastTick=performance.now(),carry=0,images=[],queue=Promise.resolve(),imageRevision=0;
function message(value){$('status').textContent=value}
function endpoint(){return $('direction').value.split(',').map(Number)}
function draw(){
 const game=$('preview').getContext('2d'),detail=$('detail').getContext('2d');
 game.clearRect(0,0,360,300);detail.clearRect(0,0,180,140);
 if(!state)return;
 const [dx,dy]=endpoint(),origin=[180-dx/2,150-dy/2],count=state.emission_count;
 // The formal line core is independent of the frame cleanup. These nested
 // translucent fills indicate its visual footprint behind the trail sprites.
 if(step<count+state.frame_count-1){
  for(const [width,color] of [[30,'rgba(255,46,5,.10)'],[12,'rgba(255,97,10,.16)'],[4,'rgba(255,199,61,.28)']]){
   game.strokeStyle=color;game.lineWidth=width;game.beginPath();game.moveTo(...origin);game.lineTo(origin[0]+dx,origin[1]+dy);game.stroke();
  }
 }
 for(let emission=Math.min(step,count-1);emission>=0;emission--){
  const age=step-emission,source=images[age];
  if(age<0||age>=6||!source?.complete||!source.naturalWidth)continue;
  const location=[origin[0]+dx*(emission+1)/count,origin[1]+dy*(emission+1)/count];
  const position=state.positions[age],center=state.sequence_center;
  game.drawImage(source,Math.round(location[0]+position[0]-center[0]),Math.round(location[1]+position[1]-center[1]));
 }
 const detailFrame=step%6,source=images[detailFrame];
 if(source?.complete&&source.naturalWidth)detail.drawImage(source,(180-source.naturalWidth)/2,(140-source.naturalHeight)/2);
 $('step-label').textContent=`第 ${step+1} 步`;$('frame-label').textContent=`F${detailFrame}`;
 for(const button of $('timeline').children)button.classList.toggle('active',Number(button.dataset.step)===step);
}
function loadImages(){const revision=++imageRevision;images=[];for(let frame=0;frame<6;frame++){const source=new Image();images[frame]=source;source.onload=()=>{if(revision===imageRevision)draw()};source.onerror=()=>message(`F${frame} 读取失败`);source.src=`/api/hellfire/frame.png?frame=${frame}&revision=${state.revision}`}draw()}
async function refresh(){const response=await fetch('/api/hellfire/state');const result=await response.json();if(!response.ok)throw Error(result.error||'读取地狱火失败');state=result;$('haze').value=state.haze_cleanup;$('haze-value').textContent=`${Math.round(state.haze_cleanup*100)}%`;$('undo').disabled=!state.undo_available;loadImages()}
async function action(body){const response=await fetch('/api/hellfire/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error||'操作失败');await refresh()}
function tune(value){queue=queue.then(()=>action({action:'tune',haze_cleanup:value})).catch(error=>message(error.message))}
function init(){
 $('direction').onchange=draw;
 $('timeline').innerHTML=Array.from({length:12},(_,index)=>`<button data-step="${index}">${index+1}</button>`).join('');
 for(const button of $('timeline').children)button.onclick=()=>{step=Number(button.dataset.step);playing=false;$('play').textContent='播放';draw()};
 $('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';lastTick=performance.now()};
 $('prev').onclick=()=>{playing=false;$('play').textContent='播放';step=(step+11)%12;draw()};
 $('next').onclick=()=>{playing=false;$('play').textContent='播放';step=(step+1)%12;draw()};
 $('haze').oninput=()=>{$('haze-value').textContent=`${Math.round(Number($('haze').value)*100)}%`};
 $('haze').onchange=()=>tune(Number($('haze').value));$('original').onclick=()=>tune(0);$('trial').onclick=()=>tune(1.5);
 $('undo').onclick=()=>{queue=queue.then(()=>action({action:'undo'})).catch(error=>message(error.message))};
 $('background').value='game';$('background').onchange=()=>{$('stage').className='stage '+$('background').value;$('detail-box').className='detail '+$('background').value};$('background').onchange();
 refresh().then(()=>{lastTick=performance.now()}).catch(error=>message(error.message));
}
function tick(now){if(state&&playing){carry+=now-lastTick;while(carry>=state.frame_time_ms){step=(step+1)%12;carry-=state.frame_time_ms}draw()}lastTick=now;requestAnimationFrame(tick)}
init();requestAnimationFrame(tick);
</script></body></html>
